name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests
        run: npm test

      - name: Replay every lesson through chess.js
        run: npm run validate:content

      - name: Build
        run: npx vite build
